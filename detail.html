<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapBoard - スポット詳細</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="btn btn--back">← 一覧に戻る</a>
    <h1 class="header__title" id="spot-name">スポット詳細</h1>
  </header>

  <main class="main">
    <section class="detail-map" id="map">
      <!-- Google Maps JS APIで地図を埋め込み -->
    </section>

    <section class="detail-info" id="detail-info">
      <!-- Places APIの情報をJS(detail.js)で動的に生成 -->
    </section>

    <section class="detail-edit">
      <h2 class="section-title">メモ・カテゴリ</h2>
      <label class="label" for="edit-category">カテゴリ</label>
      <input type="text" class="input" id="edit-category" placeholder="カテゴリを入力...">
      <label class="label" for="edit-memo">メモ</label>
      <textarea class="textarea" id="edit-memo" placeholder="メモを入力..."></textarea>
      <button class="btn btn--primary" id="btn-save">保存する</button>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/remotestoragejs@2.0.0-beta.9/release/remotestorage.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/places.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
