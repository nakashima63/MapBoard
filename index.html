<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapBoard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">MapBoard</h1>
    <button class="btn btn--primary" id="btn-add-spot">+ スポットを追加</button>
  </header>

  <main class="main">
    <section class="filter-bar">
      <input type="text" class="input input--search" id="filter-input" placeholder="スポットを絞り込む...">
      <select class="select" id="filter-category">
        <option value="">すべてのカテゴリ</option>
      </select>
    </section>

    <section class="spot-grid" id="spot-grid">
      <!-- カードはJS(app.js)で動的に生成 -->
    </section>
  </main>

  <!-- スポット追加モーダル -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title">スポットを追加</h2>
        <button class="modal__close" id="modal-close" aria-label="閉じる">✕</button>
      </div>

      <div class="modal__body">
        <label class="label" for="search-input">スポットを検索</label>
        <div class="search-dropdown">
          <input type="text" class="input" id="search-input" placeholder="店名・施設名で検索..." autocomplete="off">
          <ul class="search-results" id="search-results" role="listbox"></ul>
        </div>

        <div id="selected-spot-info" hidden>
          <div class="selected-spot">
            <p class="selected-spot__name" id="selected-name"></p>
            <p class="selected-spot__address" id="selected-address"></p>
          </div>
          <label class="label" for="category-input">カテゴリ</label>
          <input type="text" class="input" id="category-input" placeholder="例：カフェ、レストラン、公園..." list="category-list">
          <datalist id="category-list"></datalist>
        </div>
      </div>

      <div class="modal__footer">
        <button class="btn btn--secondary" id="btn-cancel">キャンセル</button>
        <button class="btn btn--primary" id="btn-save-spot" disabled>保存する</button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/remotestoragejs@2.0.0-beta.9/release/remotestorage.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/places.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
